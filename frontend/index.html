<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issue Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .header p {
      font-size: 16px;
      opacity: 0.95;
    }

    .form-section {
      padding: 40px 30px;
    }

    .input-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    input::placeholder {
      color: #aaa;
    }

    .btn-container {
      margin-top: 30px;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loader {
      display: none;
      text-align: center;
      padding: 30px;
      color: #667eea;
    }

    .loader.active {
      display: block;
    }

    .spinner {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-section {
      padding: 0 30px 40px 30px;
      display: none;
    }

    .result-section.active {
      display: block;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .result-header h2 {
      font-size: 20px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copy-btn {
      width: auto;
      padding: 8px 16px;
      font-size: 13px;
      background: #f8f9fa;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 8px;
    }

    .copy-btn:hover {
      background: #667eea;
      color: white;
    }

    pre {
      background: #1e1e1e;
      color: #e2e2e2;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
      max-height: 500px;
      overflow-y: auto;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .error {
      background: #fff5f5;
      color: #c53030;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #c53030;
    }

    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #d4edda;
      color: #155724;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .form-section {
        padding: 30px 20px;
      }

      .result-section {
        padding: 0 20px 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
        GitHub Issue Assistant
      </h1>
      <p>Analyze and understand GitHub issues with AI</p>
    </div>

    <div class="form-section">
      <div class="input-group">
        <label for="repoUrl">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 4px;">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
          Repository URL
        </label>
        <input 
          type="text" 
          id="repoUrl" 
          placeholder="Your GitHub Repo Link"
        >
      </div>

      <div class="input-group">
        <label for="issueNumber">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 4px;">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          Issue Number
        </label>
        <input 
          type="number" 
          id="issueNumber" 
          placeholder="Issue Number"
        >
      </div>

      <div class="btn-container">
        <button id="analyzeBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 8px;">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          Analyze Issue
        </button>
      </div>
    </div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>Analyzing issue...</p>
    </div>

    <div class="result-section" id="resultSection">
      <div class="result-header">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Analysis Result
        </h2>
        <button class="copy-btn" id="copyBtn">Copy JSON</button>
      </div>
      <div id="successBadge"></div>
      <pre id="output"></pre>
    </div>
  </div>

  <script>
    const analyzeBtn = document.getElementById("analyzeBtn");
    const repoUrlInput = document.getElementById("repoUrl");
    const issueNumberInput = document.getElementById("issueNumber");
    const output = document.getElementById("output");
    const loader = document.getElementById("loader");
    const resultSection = document.getElementById("resultSection");
    const copyBtn = document.getElementById("copyBtn");
    const successBadge = document.getElementById("successBadge");

    let currentResult = "";

    analyzeBtn.addEventListener("click", async () => {
      const repoUrl = repoUrlInput.value.trim();
      const issueNumber = issueNumberInput.value.trim();

      if (!repoUrl || !issueNumber) {
        output.className = "error";
        output.textContent = "❌ Please enter both repository URL and issue number";
        resultSection.classList.add("active");
        return;
      }

      output.className = "";
      output.textContent = "";
      resultSection.classList.remove("active");
      loader.classList.add("active");
      analyzeBtn.disabled = true;

      try {
        const res = await fetch("http://127.0.0.1:8000/analyze_issue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repo_url: repoUrl,
            issue_number: parseInt(issueNumber)
          })
        });

        if (!res.ok) {
          const msg = await res.text();
          throw new Error(msg);
        }

        const data = await res.json();
        currentResult = JSON.stringify(data, null, 2);
        output.textContent = currentResult;
        
        successBadge.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Successfully analyzed
        `;
        successBadge.className = "success-badge";
        
        resultSection.classList.add("active");

      } catch (err) {
        output.className = "error";
        output.textContent = `❌ Error: ${err.message}`;
        successBadge.innerHTML = "";
        resultSection.classList.add("active");
      }

      loader.classList.remove("active");
      analyzeBtn.disabled = false;
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(currentResult).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "✓ Copied!";
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 2000);
      });
    });

    // Allow Enter key to submit
    [repoUrlInput, issueNumberInput].forEach(input => {
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          analyzeBtn.click();
        }
      });
    });
  </script>
</body>
</html>
